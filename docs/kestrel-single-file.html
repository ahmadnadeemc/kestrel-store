<title>Kestrel Supply Co.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Kestrel — layout: sticky header over a 1240px measured rail; full-bleed bands, content in a padded rail. */
:root {
  --paper: #F5F6F9;
  --surface: #FFFFFF;
  --surface-2: #EDEFF4;
  --ink: #0F1218;
  --ink-2: #59637A;
  --line: #DEE3EB;
  --accent: #1C3FD4;
  --accent-soft: #E7EBFC;
  --on-accent: #FFFFFF;
  --signal: #B23C0B;
  --ok: #0E7A52;
  --shadow: 0 1px 2px rgba(16, 20, 35, .06), 0 12px 28px -18px rgba(16, 20, 35, .35);
  --shadow-lift: 0 2px 4px rgba(16, 20, 35, .07), 0 26px 48px -26px rgba(16, 20, 35, .45);

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;

  --rail: 1240px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B0D12;
    --surface: #12151D;
    --surface-2: #1A1E28;
    --ink: #ECEFF4;
    --ink-2: #99A3B6;
    --line: #242A36;
    --accent: #7D9BFF;
    --accent-soft: #1A2140;
    --on-accent: #0B0D12;
    --signal: #F59368;
    --ok: #4FC38C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 30px -18px rgba(0, 0, 0, .8);
    --shadow-lift: 0 2px 6px rgba(0, 0, 0, .55), 0 28px 54px -24px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0B0D12;
  --surface: #12151D;
  --surface-2: #1A1E28;
  --ink: #ECEFF4;
  --ink-2: #99A3B6;
  --line: #242A36;
  --accent: #7D9BFF;
  --accent-soft: #1A2140;
  --on-accent: #0B0D12;
  --signal: #F59368;
  --ok: #4FC38C;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 30px -18px rgba(0, 0, 0, .8);
  --shadow-lift: 0 2px 6px rgba(0, 0, 0, .55), 0 28px 54px -24px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 60;
  background: var(--surface);
}
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 {
  font-family: var(--display);
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.08;
  text-wrap: balance;
  margin: 0;
}
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.rail {
  width: 100%;
  max-width: var(--rail);
  margin-inline: auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.price { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.muted { color: var(--ink-2); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  border-radius: var(--r-md);
  padding: 11px 18px;
  font-weight: 600;
  font-size: 15px;
  background: var(--accent);
  color: var(--on-accent);
  transition: transform .14s ease, filter .14s ease, background .14s ease;
}
.btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn--ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn--ghost:hover { background: var(--surface-2); filter: none; }
.btn--quiet { background: var(--surface-2); color: var(--ink); }
.btn--block { width: 100%; }
.btn--lg { padding: 14px 24px; font-size: 16px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .04em;
  padding: 5px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  white-space: nowrap;
}
.badge {
  position: absolute;
  top: 12px;
  left: 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  background: var(--ink);
  color: var(--paper);
}
.badge--sale { background: var(--signal); color: #fff; }
.badge--new { background: var(--accent); color: var(--on-accent); }

/* ---------- header ---------- */
.site-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.ticker {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .08em;
}
.ticker .rail { display: flex; gap: 26px; justify-content: center; padding-block: 7px; flex-wrap: wrap; }
.ticker span { white-space: nowrap; }
.header-bar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 18px;
  padding-block: 14px;
}
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.03em; background: none; border: 0; padding: 0; }
.logo-mark { width: 26px; height: 26px; flex: none; color: var(--accent); }
.nav { display: flex; gap: 4px; justify-self: center; }
.nav button {
  background: none;
  border: 0;
  padding: 8px 13px;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 15px;
  color: var(--ink-2);
  white-space: nowrap;
}
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }
.header-tools { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  position: relative;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  flex: none;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }
.cart-count {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-family: var(--mono);
  font-size: 11px;
  display: grid;
  place-items: center;
}
.search {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 0 12px;
  height: 40px;
  min-width: 0;
  max-width: 300px;
  flex: 1;
}
.search:focus-within { border-color: var(--accent); }
.search svg { width: 16px; height: 16px; color: var(--ink-2); flex: none; }
.search input { border: 0; background: none; outline: none; font: inherit; font-size: 14.5px; color: inherit; width: 100%; min-width: 0; }

/* ---------- hero ---------- */
.hero { border-bottom: 1px solid var(--line); background: var(--surface); }
.hero .rail { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; padding-block: 60px; }
.hero h1 { font-size: clamp(36px, 5.2vw, 62px); font-weight: 800; }
.hero-copy { display: grid; gap: 20px; justify-items: start; }
.hero-lede { font-size: 17.5px; color: var(--ink-2); max-width: 46ch; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.hero-specs { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-stage {
  position: relative;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background:
    radial-gradient(120% 90% at 70% 10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    var(--surface-2);
  padding: 26px;
  display: grid;
  gap: 14px;
}
.hero-stage .stage-art { aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; }
.hero-stage .stage-art svg { width: 100%; height: 100%; }
.stage-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.stage-meta strong { font-family: var(--display); font-size: 17px; }
.stage-meta .price { font-size: 19px; }

/* ---------- section scaffolding ---------- */
.section { padding-block: 54px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
.section-head h2 { font-size: clamp(25px, 3vw, 34px); }
.section-head p { color: var(--ink-2); max-width: 54ch; margin-top: 7px; }
.link-btn { background: none; border: 0; padding: 0; font-weight: 600; color: var(--accent); display: inline-flex; gap: 6px; align-items: center; }
.link-btn:hover { text-decoration: underline; }

/* ---------- category strip ---------- */
.cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.cat {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 16px;
  display: grid;
  gap: 10px;
  text-align: left;
  transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.cat:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.cat svg { width: 30px; height: 30px; color: var(--accent); }
.cat strong { font-family: var(--display); font-size: 15.5px; }
.cat span { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }

/* ---------- product grid ---------- */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  min-width: 0;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.card-art {
  position: relative;
  aspect-ratio: 1 / 1;
  max-width: 100%;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  padding: 18px;
  border: 0;
  width: 100%;
}
.card-art svg { width: 100%; height: 100%; }
.wish {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 32px;
  height: 32px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid;
  place-items: center;
  color: var(--ink-2);
  z-index: 2;
}
.wish svg { width: 15px; height: 15px; }
.wish[aria-pressed="true"] { color: var(--signal); border-color: var(--signal); }
.card-body { display: grid; gap: 7px; padding: 14px 16px 16px; min-width: 0; }
.card-body .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.card-title { font-family: var(--display); font-size: 16.5px; font-weight: 700; letter-spacing: -.015em; text-align: left; background: none; border: 0; padding: 0; }
.card-title:hover { color: var(--accent); }
.rating { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.stars { display: inline-flex; gap: 1.5px; color: var(--accent); }
.stars svg { width: 12px; height: 12px; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
.card-foot .price { font-size: 17px; font-weight: 600; }
.was { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); text-decoration: line-through; margin-left: 6px; }
.add-mini { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 7px 12px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.add-mini:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.stock { font-family: var(--mono); font-size: 11px; color: var(--ok); }
.stock--low { color: var(--signal); }

/* ---------- value band ---------- */
.band { background: var(--surface); border-block: 1px solid var(--line); }
.band .rail { padding-block: 40px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.value { display: grid; gap: 6px; min-width: 0; }
.value svg { width: 22px; height: 22px; color: var(--accent); }
.value strong { font-family: var(--display); font-size: 15.5px; }
.value p { font-size: 14px; color: var(--ink-2); }

/* ---------- shop layout ---------- */
.shop { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 34px; align-items: start; padding-block: 36px; }
.filters { display: grid; gap: 24px; position: sticky; top: 150px; align-content: start; }
.filter-group { display: grid; gap: 10px; }
.filter-group h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
.check { display: flex; align-items: center; gap: 9px; font-size: 14.5px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.check .count { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.range { display: grid; gap: 8px; }
.range input[type="range"] { width: 100%; accent-color: var(--accent); }
.range output { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.shop-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.shop-head h1 { font-size: 28px; }
.shop-head .result-count { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
select {
  font: inherit;
  font-size: 14.5px;
  padding: 9px 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.filter-toggle { display: none; }
.empty { border: 1px dashed var(--line); border-radius: var(--r-lg); padding: 48px 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }

/* ---------- product detail ---------- */
.pdp { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; padding-block: 32px; align-items: start; }
.crumbs { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); padding-top: 22px; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); }
.gallery { display: grid; gap: 12px; position: sticky; top: 150px; min-width: 0; }
.gallery-main {
  aspect-ratio: 1 / 1;
  max-width: 100%;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background:
    radial-gradient(110% 80% at 65% 15%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 62%),
    var(--surface-2);
  display: grid;
  place-items: center;
  padding: 40px;
}
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.thumb { aspect-ratio: 1 / 1; max-width: 100%; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); padding: 12px; display: grid; place-items: center; }
.thumb[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pdp-info { display: grid; gap: 18px; min-width: 0; }
.pdp-info h1 { font-size: clamp(28px, 3.6vw, 40px); }
.pdp-price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pdp-price .price { font-size: 30px; font-weight: 600; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px 6px 7px; font-size: 14px; }
.swatch i { width: 16px; height: 16px; border-radius: 999px; border: 1px solid rgba(0, 0, 0, .18); }
.swatch[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.qty button { width: 40px; height: 42px; background: none; border: 0; font-size: 17px; }
.qty button:hover { background: var(--surface-2); }
.qty output { width: 44px; text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.buy-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.specs { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.specs th, .specs td { text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.specs th { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; width: 42%; }
.specs td { font-family: var(--mono); font-size: 13.5px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 11px 14px; font-weight: 600; font-size: 14.5px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab-panel { padding-top: 18px; display: grid; gap: 14px; font-size: 15.5px; color: var(--ink-2); max-width: 66ch; }
.tab-panel strong { color: var(--ink); }
.ship-list { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.ship-list li { display: flex; gap: 10px; align-items: flex-start; }
.ship-list li::before { content: "—"; font-family: var(--mono); color: var(--accent); }

/* ---------- cart ---------- */
.cart-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 34px; padding-block: 32px; align-items: start; }
.lines { display: grid; gap: 12px; min-width: 0; }
.line {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr) auto;
  gap: 16px;
  align-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 12px;
}
.line-art { aspect-ratio: 1 / 1; max-width: 100%; border-radius: var(--r-sm); background: var(--surface-2); padding: 9px; display: grid; place-items: center; }
.line-meta { display: grid; gap: 4px; min-width: 0; }
.line-meta strong { font-family: var(--display); font-size: 15.5px; }
.line-meta .variant { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.line-right { display: grid; gap: 8px; justify-items: end; }
.remove { background: none; border: 0; padding: 0; font-size: 13px; color: var(--ink-2); text-decoration: underline; }
.remove:hover { color: var(--signal); }
.summary { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; position: sticky; top: 150px; align-content: start; }
.summary h2 { font-size: 19px; }
.sum-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; }
.sum-row span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sum-total { border-top: 1px solid var(--line); padding-top: 13px; font-size: 18px; font-weight: 700; }
.sum-total span:last-child { font-size: 21px; }
.promo { display: flex; gap: 8px; }
.promo input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper); color: inherit; }
.note { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }

/* ---------- checkout ---------- */
.checkout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 34px; padding-block: 32px; align-items: start; }
.checkout-main { display: grid; gap: 22px; min-width: 0; }
.steps { display: flex; gap: 18px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.step i { width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-style: normal; }

const KEY = "kestrel.v1";
const state = {
  view: "home",
  productId: null,
  query: "",
  cats: new Set(),
  brands: new Set(),
  maxPrice: 1400,
  inStockOnly: false,
  saleOnly: false,
  sort: "featured",
  filtersOpen: false,
  cart: [],
  wish: new Set(),
  promo: null,
  theme: null,
  drawer: false,
  pdp: { qty: 1, color: 0, tab: "overview" },
  order: null,
};

/* ---------- storage ---------- */
function save() {
  try {
    localStorage.setItem(
      KEY,
      JSON.stringify({ cart: state.cart, wish: [...state.wish], promo: state.promo, theme: state.theme })
    );
  } catch (e) {
    /* private window or blocked storage — the page still works, it just forgets. */
  }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.cart)) state.cart = d.cart;
    if (Array.isArray(d.wish)) state.wish = new Set(d.wish);
    if (d.promo && PROMOS[d.promo]) state.promo = d.promo;
    if (d.theme === "dark" || d.theme === "light") state.theme = d.theme;
  } catch (e) {
    /* ignore unreadable storage */
  }
}

/* ---------- helpers ---------- */
const money = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const byId = (id) => PRODUCTS.find((p) => p.id === id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function stars(rating) {
  return (
    '<span class="stars">' +
    [1, 2, 3, 4, 5]
      .map((i) => '<span style="opacity:' + (i <= Math.round(rating) ? 1 : 0.25) + '">' + ICON.star + "</span>")
      .join("") +
    "</span>"
  );
}
function art(p) {
  return (ART[p.art] || ART.headphones)();
}
function stockLine(p) {
  if (p.stock === 0) return '<span class="stock stock--low">Sold out</span>';
  if (p.stock <= 10) return '<span class="stock stock--low">Only ' + p.stock + " left</span>";
  return '<span class="stock">In stock</span>';
}

/* ---------- cart maths ---------- */
const cartCount = () => state.cart.reduce((n, l) => n + l.qty, 0);
const subtotal = () => state.cart.reduce((n, l) => n + byId(l.id).price * l.qty, 0);
function totals() {
  const sub = subtotal();
  const discount = state.promo ? sub * PROMOS[state.promo] : 0;
  const net = sub - discount;
  const ship = state.cart.length === 0 || net >= FREE_SHIP_OVER ? 0 : SHIP_FLAT;
  const tax = net * TAX_RATE;
  return { sub, discount, ship, tax, total: net + ship + tax };
}

/* ---------- actions ---------- */
function go(view, opts = {}) {
  state.view = view;
  if (opts.id) state.productId = opts.id;
  if (view === "product") state.pdp = { qty: 1, color: 0, tab: "overview" };
  state.drawer = false;
  render();
  window.scrollTo({ top: 0, behavior: "instant" in document.documentElement.style ? "instant" : "auto" });
}
function addToCart(id, qty = 1, color = 0) {
  const p = byId(id);
  if (!p || p.stock === 0) return;
  const variant = p.colors[color] ? p.colors[color].name : "Standard";
  const line = state.cart.find((l) => l.id === id && l.variant === variant);
  if (line) line.qty = Math.min(line.qty + qty, 10);
  else state.cart.push({ id, variant, qty });
  save();
  toast(p.name + " added to cart");
  render();
}
function setQty(i, delta) {
  const line = state.cart[i];
  if (!line) return;
  line.qty += delta;
  if (line.qty < 1) state.cart.splice(i, 1);
  else line.qty = Math.min(line.qty, 10);
  save();
  render();
}
function toggleWish(id) {
  if (state.wish.has(id)) {
    state.wish.delete(id);
    toast("Removed from saved");
  } else {
    state.wish.add(id);
    toast("Saved for later");
  }
  save();
  render();
}
function toast(msg) {
  const host = document.getElementById("toasts");
  if (!host) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = ICON.check + "<span>" + esc(msg) + "</span>";
  host.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function setTheme(next) {
  state.theme = next;
  document.documentElement.setAttribute("data-theme", next);
  save();
  render();
}
function currentTheme() {
  if (state.theme) return state.theme;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

/* ---------- filtering ---------- */
function visibleProducts() {
  const q = state.query.trim().toLowerCase();
  let out = PRODUCTS.filter((p) => {
    if (state.cats.size && !state.cats.has(p.cat)) return false;
    if (state.brands.size && !state.brands.has(p.brand)) return false;
    if (p.price > state.maxPrice) return false;
    if (state.inStockOnly && p.stock === 0) return false;
    if ((state.saleOnly || state.view === "deals") && !p.was) return false;
    if (q) {
      const hay = (p.name + " " + p.brand + " " + p.blurb + " " + p.cat).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const s = state.sort;
  if (s === "price-asc") out.sort((a, b) => a.price - b.price);
  if (s === "price-desc") out.sort((a, b) => b.price - a.price);
  if (s === "rating") out.sort((a, b) => b.rating - a.rating);
  if (s === "new") out.sort((a, b) => (b.tag === "new") - (a.tag === "new"));
  return out;
}

/* ---------- components ---------- */
function cardHtml(p) {
  const saved = state.wish.has(p.id);
  return (
    '<article class="card">' +
    (p.tag === "sale"

      : p.tag === "new"
      ? '<span class="badge badge--new">New</span>'
      : "") +
    '<button class="wish" data-act="wish" data-id="' +
    p.id +
    '" aria-pressed="' +
    saved +
    '" aria-label="' +
    (saved ? "Remove " + esc(p.name) + " from saved" : "Save " + esc(p.name) + " for later") +
    '">' +
    (saved ? ICON.heartFull : ICON.heart) +
    "</button>" +
    '<button class="card-art" data-act="open" data-id="' +
    p.id +
    '" aria-label="View ' +
    esc(p.name) +
    '">' +
    art(p) +
    "</button>" +
    '<div class="card-body">' +
    '<span class="kicker">' +
    esc(p.brand) +
    " · " +
    esc(p.cat) +
    "</span>" +
    '<button class="card-title" data-act="open" data-id="' +
    p.id +
    '">' +
    esc(p.name) +
    "</button>" +
    '<div class="rating">' +
    stars(p.rating) +
    "<span>" +
    p.rating.toFixed(1) +
    " (" +
    p.reviews.toLocaleString("en-US") +
    ")</span></div>" +
    stockLine(p) +
    '<div class="card-foot"><div><span class="price">' +
    money(p.price) +
    "</span>" +
    (p.was ? '<span class="was">' + money(p.was) + "</span>" : "") +
    "</div>" +
    '<button class="add-mini" data-act="add" data-id="' +
    p.id +
    '"' +
    (p.stock === 0 ? " disabled" : "") +
    ">" +
    (p.stock === 0 ? "Sold out" : "Add") +
    "</button></div>" +
    "</div></article>"
  );
}

    "</div></div>" +
    '<div style="display:grid;gap:14px;max-width:62ch"><h2 style="font-size:26px">How we test</h2>' +
    '<p class="muted">Headphones get 40 hours of listening and a measured battery run-down. Keyboards get a week of real work and a sound recording. Cameras go on an actual job. We publish the numbers we measured, even when they are lower than the box claims.</p>' +
    '<h2 style="font-size:26px;margin-top:10px">Repairs</h2>' +
    '<p class="muted">Bring anything we sold back to the Harbour Row bench and we will quote a repair before we quote a replacement. Out-of-warranty work is charged at cost of parts plus one hour of labour.</p></div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" data-act="nav" data-view="shop">See the range</button><button class="btn btn--ghost" data-act="nav" data-view="deals">Current deals</button></div>' +
    "</div>"
  );
}

/* ---------- render ---------- */
function mainHtml() {
  switch (state.view) {
    case "shop":
      return shopView("All products", "Fourteen products across five categories. Filter on the left, sort on the right.");
    case "deals":
      return shopView("Deals", "Price cuts running this month. Stock on sale items is not replaced once it goes.");
    case "product":
      return productView();
    case "cart":
      return cartView();
    case "checkout":
      return checkoutView();
    case "confirm":
      return confirmView();
    case "about":
      return aboutView();
    default:
      return homeView();
  }
}

function drawerHtml() {
  if (!state.drawer) return "";
  const t = totals();
  return (
    '<button class="scrim" data-act="drawer-close" aria-label="Close cart"></button>' +
    '<aside class="drawer" role="dialog" aria-label="Cart">' +
    '<div class="drawer-head"><h2>Cart · ' +
    cartCount() +
    '</h2><button class="icon-btn" data-act="drawer-close" aria-label="Close">' +
    ICON.close +
    "</button></div>" +
    '<div class="drawer-body">' +
    (state.cart.length
      ? state.cart
          .map((l, i) => {
            const p = byId(l.id);
            return (
              '<div class="line"><div class="line-art">' +
              art(p) +
              '</div><div class="line-meta"><strong>' +
              esc(p.name) +
              '</strong><span class="variant">' +
              esc(l.variant) +
              " · " +
              money(p.price) +
              '</span><div class="qty" style="margin-top:4px"><button data-act="line-qty" data-i="' +
              i +
              '" data-d="-1" aria-label="Decrease">−</button><output>' +
              l.qty +
              '</output><button data-act="line-qty" data-i="' +
              i +
              '" data-d="1" aria-label="Increase">+</button></div></div>' +
              '<div class="line-right"><span class="price">' +
              money(p.price * l.qty) +
              '</span><button class="remove" data-act="line-remove" data-i="' +
              i +
              '">Remove</button></div></div>'
            );
          })
          .join("")
      : '<p class="muted">Nothing here yet. Add something from the range.</p>') +
    "</div>" +
    '<div class="drawer-foot">' +
    '<div class="sum-row sum-total" style="border:0;padding:0"><span>Subtotal</span><span class="price">' +
    money(t.sub) +
    "</span></div>" +
    '<button class="btn btn--block" data-act="nav" data-view="cart"' +
    (state.cart.length ? "" : " disabled") +
    ">View cart</button>" +
    '<button class="btn btn--ghost btn--block" data-act="nav" data-view="checkout"' +
    (state.cart.length ? "" : " disabled") +
    ">Checkout</button>" +
    "</div></aside>"
  );
}

function render() {
  const focusId = document.activeElement && document.activeElement.id;
  const caret = focusId === "q" ? document.activeElement.selectionStart : null;
  document.getElementById("header").innerHTML = headerHtml();
  document.getElementById("main").innerHTML = mainHtml();
  document.getElementById("footer").innerHTML = footerHtml();
  document.getElementById("overlay").innerHTML = drawerHtml();
  if (focusId === "q") {
    const q = document.getElementById("q");
    if (q) {
      q.focus();
      if (caret !== null) q.setSelectionRange(caret, caret);
    }
  }
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === "A") e.preventDefault();
  switch (act) {
    case "nav":
      go(el.dataset.view);
      break;
    case "open":
      go("product", { id: el.dataset.id });
      break;
    case "add":
      addToCart(el.dataset.id);
      break;
    case "wish":
      toggleWish(el.dataset.id);
      break;
    case "theme":
      setTheme(currentTheme() === "dark" ? "light" : "dark");
      break;
    case "drawer":
      state.drawer = true;
      render();
      break;
    case "drawer-close":
      state.drawer = false;
      render();
      break;
    case "cat-link":
      state.cats = new Set([el.dataset.cat]);
      state.query = "";
      go("shop");
      break;
    case "filters-toggle":
      state.filtersOpen = !state.filtersOpen;
      render();
      break;
    case "filter-clear":
      state.cats = new Set();
      state.brands = new Set();
      state.maxPrice = 1400;
      state.inStockOnly = false;
      state.saleOnly = false;
      state.query = "";
      render();
      break;
    case "pdp-qty": {
      const next = state.pdp.qty + Number(el.dataset.d);
      state.pdp.qty = Math.min(10, Math.max(1, next));
      render();
      break;
    }
    case "pdp-add":
      addToCart(state.productId, state.pdp.qty, state.pdp.color);
      break;
    case "color":
      state.pdp.color = Number(el.dataset.i);
      render();
      break;
    case "thumb":
      state.pdp.thumb = Number(el.dataset.i);
      render();
      break;
    case "tab":
      state.pdp.tab = el.dataset.tab;
      render();
      break;
    case "line-qty":
      setQty(Number(el.dataset.i), Number(el.dataset.d));
      break;
    case "line-remove":
      state.cart.splice(Number(el.dataset.i), 1);
      save();
      toast("Removed from cart");
      render();
      break;
    case "pay":
      document.querySelectorAll('[data-act="pay"]').forEach((b) => b.setAttribute("aria-pressed", b === el));
      break;
    case "noop":
      toast("Demo page — not wired up");
      break;
  }
});

document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "filter-cat") {
    el.checked ? state.cats.add(el.dataset.cat) : state.cats.delete(el.dataset.cat);
    render();
  }
  if (act === "filter-brand") {
    el.checked ? state.brands.add(el.dataset.brand) : state.brands.delete(el.dataset.brand);
    render();
  }
  if (act === "filter-stock") {
    state.inStockOnly = el.checked;
    render();
  }
  if (act === "filter-sale") {
    state.saleOnly = el.checked;
    render();
  }
  if (act === "sort") {
    state.sort = el.value;
    render();
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "q") {
    state.query = e.target.value;
    if (state.view !== "shop" && state.view !== "deals") state.view = "shop";
    render();
  }
  if (e.target.dataset && e.target.dataset.act === "filter-price") {
    state.maxPrice = Number(e.target.value);
    const out = e.target.parentElement.querySelector("output");
    if (out) out.textContent = "Up to " + money(state.maxPrice);
    clearTimeout(window.__priceT);
    window.__priceT = setTimeout(render, 220);
  }
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const form = e.target;
  if (form.id === "promo-form") {
    const code = (document.getElementById("promo-code").value || "").trim().toUpperCase();
    if (PROMOS[code]) {
      state.promo = code;
      save();
      toast(code + " applied — " + PROMOS[code] * 100 + "% off");
    } else {
      toast("That code is not valid");
    }
    render();
  }
  if (form.id === "news-form") {
    const input = document.getElementById("news-email");
    toast("Subscribed " + (input.value || "you") + " — one email a month");
    input.value = "";
  }
  if (form.id === "checkout-form") {
    state.order = "KES-" + String(Math.floor(100000 + Math.random() * 900000));
    state.cart = [];
    state.promo = null;
    save();
    go("confirm");
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.drawer) {
    state.drawer = false;
    render();
  }
});

/* ---------- boot ---------- */
load();
if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
render();

</script>
